## ESP-IDF Managed Component Dependencies (ADR-045)
dependencies:
  ## LVGL graphics library
  lvgl/lvgl: "~8.3"

  ## CST816S capacitive touch driver
  espressif/esp_lcd_touch_cst816s: "^1.0"

  ## LCD touch abstraction
  espressif/esp_lcd_touch: "^1.0"

  ## Onboard WS2812 LED Disabling
  espressif/led_strip: "^3.0.0"

  ## ThroughNet R1 (ROADMAP Phase R): resolve the sensing server via mDNS
  ## (`_throughnet._udp.local`) so a host/router IP change doesn't kill the
  ## CSI stream. RX nodes query this; the NVS target_ip stays as fallback.
  espressif/mdns: "^1.2"
